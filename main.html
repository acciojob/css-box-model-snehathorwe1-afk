<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model Design</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .box {
            width: 300px;
            padding: 50px;
            border: 15px solid blue;
            margin: 20px;
            background-color: lightblue;
        }

        .content {
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="box">
        <div class="content">
            This is a demo of box model try to replicate
            this box model in HTML and CSS and try
            to pass all the test cases.
        </div>
    </div>

</body>
</html>
